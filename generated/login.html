<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 - 开盘啦场景系统</title>
  <style>
    :root { --bg:#f4f6f8; --panel:#fff; --ink:#17202a; --muted:#667380; --line:#d8dee6; --accent:#136f63; --danger:#b0302a; --radius:8px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI","Microsoft YaHei",Arial,sans-serif; }
    .card { width:min(420px, calc(100% - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:28px; box-shadow:0 10px 24px rgba(25,34,45,.08); }
    h1 { margin:0 0 6px; font-size:22px; }
    .sub { margin:0 0 22px; color:var(--muted); }
    label { display:block; margin:14px 0 6px; font-weight:600; }
    input { width:100%; height:40px; border:1px solid var(--line); border-radius:var(--radius); padding:0 12px; font:inherit; }
    button { width:100%; height:40px; margin-top:18px; border:1px solid var(--accent); border-radius:var(--radius); background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.65; cursor:not-allowed; }
    .msg { min-height:22px; margin-top:14px; color:var(--danger); }
    .hint, .links { margin-top:18px; color:var(--muted); font-size:12px; }
    a { color:var(--accent); font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>登录</h1>
    <p class="sub">请使用管理员账号，或有效期内的普通用户账号访问系统。</p>
    <form id="form">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">登录</button>
      <div id="msg" class="msg"></div>
    </form>
    <div class="links">没有账号？<a id="registerLink" href="/register.html">注册账号</a></div>
  </main>
  <script>
    const next = new URLSearchParams(location.search).get("next") || "/";
    document.getElementById("registerLink").href = `/register.html?next=${encodeURIComponent(next)}`;
    const msg = document.getElementById("msg");
    const submit = document.getElementById("submit");
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      msg.textContent = "";
      submit.disabled = true;
      try {
        const payload = {
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value
        };
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (response.ok) {
          location.href = next;
        } else if (data.error === "expired") {
          location.href = "/expired.html";
        } else {
          msg.textContent = data.message || "登录失败";
        }
      } catch (error) {
        msg.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
