<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>账号已到期</title>
  <style>
    :root { --bg:#f4f6f8; --panel:#fff; --ink:#17202a; --muted:#667380; --line:#d8dee6; --accent:#136f63; --amber:#9f5b13; --danger:#b0302a; --radius:8px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI","Microsoft YaHei",Arial,sans-serif; }
    .card { width:min(560px, calc(100% - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:28px; box-shadow:0 10px 24px rgba(25,34,45,.08); }
    h1 { margin:0 0 8px; font-size:24px; color:var(--amber); }
    p { margin:10px 0; color:var(--muted); }
    label { display:block; margin:18px 0 6px; font-weight:700; }
    input { width:100%; height:40px; border:1px solid var(--line); border-radius:var(--radius); padding:0 12px; font:inherit; text-transform:uppercase; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
    a, button { height:38px; display:inline-flex; align-items:center; justify-content:center; padding:0 14px; border-radius:var(--radius); border:1px solid var(--line); background:#fff; color:var(--ink); text-decoration:none; cursor:pointer; font:inherit; font-weight:600; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
    .msg { min-height:22px; margin-top:12px; color:var(--danger); }
  </style>
</head>
<body>
  <main class="card">
    <h1>账号已到期</h1>
    <p>当前账号不在可用期限内，系统已拒绝访问受限资源。</p>
    <p>请输入管理员提供的激活码，兑换成功后账号会自动续期。</p>
    <form id="redeemForm">
      <label for="code">激活码</label>
      <input id="code" name="code" autocomplete="one-time-code" placeholder="XXXX-XXXX-XXXX-XXXX-XXXX-XXXX" required>
      <div class="actions">
        <button class="primary" type="submit">兑换并续期</button>
        <a href="/login.html">重新登录</a>
        <button id="logout" type="button">退出</button>
      </div>
      <div id="msg" class="msg"></div>
    </form>
  </main>
  <script>
    const msg = document.getElementById("msg");
    document.getElementById("redeemForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      msg.textContent = "";
      try {
        const response = await fetch("/api/auth/redeem", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: document.getElementById("code").value.trim() })
        });
        const data = await response.json().catch(() => ({}));
        if (response.ok) {
          msg.style.color = "#136f63";
          msg.textContent = `续期成功，有效期至 ${data.expires_at}`;
          setTimeout(() => location.href = "/", 800);
        } else if (response.status === 401) {
          location.href = "/login.html?next=/expired.html";
        } else {
          msg.style.color = "#b0302a";
          msg.textContent = data.message || "激活码无效";
        }
      } catch (error) {
        msg.style.color = "#b0302a";
        msg.textContent = error.message;
      }
    });
    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST" });
      location.href = "/login.html";
    });
  </script>
</body>
</html>
