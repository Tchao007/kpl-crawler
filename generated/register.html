<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册账号</title>
  <style>
    :root { --bg:#f4f6f8; --panel:#fff; --ink:#17202a; --muted:#667380; --line:#d8dee6; --accent:#136f63; --danger:#b0302a; --radius:8px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI","Microsoft YaHei",Arial,sans-serif; }
    .card { width:min(440px, calc(100% - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:28px; box-shadow:0 10px 24px rgba(25,34,45,.08); }
    h1 { margin:0 0 6px; font-size:22px; }
    .sub { margin:0 0 22px; color:var(--muted); }
    label { display:block; margin:14px 0 6px; font-weight:600; }
    input { width:100%; height:40px; border:1px solid var(--line); border-radius:var(--radius); padding:0 12px; font:inherit; }
    button { width:100%; height:40px; margin-top:18px; border:1px solid var(--accent); border-radius:var(--radius); background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.65; cursor:not-allowed; }
    .msg { min-height:22px; margin-top:14px; color:var(--danger); }
    .links { margin-top:18px; color:var(--muted); font-size:12px; }
    a { color:var(--accent); font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>注册账号</h1>
    <p class="sub">注册成功后需要使用管理员提供的激活码开通有效期。</p>
    <form id="form">
      <label for="username">用户名</label>
      <input id="username" name="username" autocomplete="username" placeholder="3-32 位字母、数字、点、横线或下划线" required>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="6" required>
      <label for="confirmPassword">确认密码</label>
      <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required>
      <button id="submit" type="submit">注册账号</button>
      <div id="msg" class="msg"></div>
    </form>
    <div class="links">已有账号？<a id="loginLink" href="/login.html">返回登录</a></div>
  </main>
  <script>
    const next = new URLSearchParams(location.search).get("next") || "/";
    document.getElementById("loginLink").href = `/login.html?next=${encodeURIComponent(next)}`;
    const msg = document.getElementById("msg");
    const submit = document.getElementById("submit");
    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      msg.textContent = "";
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      if (password !== confirmPassword) {
        msg.textContent = "两次输入的密码不一致";
        return;
      }
      submit.disabled = true;
      try {
        const payload = {
          username: document.getElementById("username").value.trim(),
          password,
          confirm_password: confirmPassword
        };
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (response.ok) {
          location.href = data.error === "expired" ? "/expired.html" : next;
        } else {
          msg.textContent = data.message || "注册失败";
        }
      } catch (error) {
        msg.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
