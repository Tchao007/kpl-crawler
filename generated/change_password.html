<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>修改密码</title>
  <style>
    :root { --bg:#f4f6f8; --panel:#fff; --ink:#17202a; --muted:#667380; --line:#d8dee6; --accent:#136f63; --danger:#b0302a; --radius:8px; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font:14px/1.5 "Segoe UI","Microsoft YaHei",Arial,sans-serif; }
    .card { width:min(440px, calc(100% - 32px)); background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:28px; box-shadow:0 10px 24px rgba(25,34,45,.08); }
    h1 { margin:0 0 6px; font-size:22px; }
    .sub { margin:0 0 22px; color:var(--muted); }
    label { display:block; margin:14px 0 6px; font-weight:600; }
    input { width:100%; height:40px; border:1px solid var(--line); border-radius:var(--radius); padding:0 12px; font:inherit; }
    button { width:100%; height:40px; margin-top:18px; border:1px solid var(--accent); border-radius:var(--radius); background:var(--accent); color:#fff; font-weight:700; cursor:pointer; }
    button:disabled { opacity:.65; cursor:not-allowed; }
    .msg { min-height:22px; margin-top:14px; color:var(--danger); }
    .links { margin-top:18px; color:var(--muted); font-size:12px; display:flex; gap:14px; }
    a { color:var(--accent); font-weight:700; text-decoration:none; }
    .user { margin:0 0 10px; color:var(--muted); font-size:13px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>修改密码</h1>
    <p class="sub">先验证当前登录状态，再修改自己的登录密码。</p>
    <p id="user" class="user"></p>
    <form id="form">
      <label for="oldPassword">旧密码</label>
      <input id="oldPassword" name="old_password" type="password" autocomplete="current-password" required>
      <label for="newPassword">新密码</label>
      <input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="6" required>
      <label for="confirmPassword">确认新密码</label>
      <input id="confirmPassword" name="confirm_password" type="password" autocomplete="new-password" minlength="6" required>
      <button id="submit" type="submit">保存修改</button>
      <div id="msg" class="msg"></div>
    </form>
    <div class="links">
      <a id="loginLink" href="/login.html">返回登录</a>
      <a id="homeLink" href="/">返回首页</a>
    </div>
  </main>
  <script>
    const next = new URLSearchParams(location.search).get("next") || "/";
    document.getElementById("loginLink").href = `/login.html?next=${encodeURIComponent(next)}`;
    document.getElementById("homeLink").href = next;

    const msg = document.getElementById("msg");
    const submit = document.getElementById("submit");
    const userEl = document.getElementById("user");

    async function loadMe() {
      const response = await fetch("/api/auth/me", { credentials: "include" });
      const data = await response.json();
      if (!response.ok) {
        location.href = `/login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
        return null;
      }
      userEl.textContent = `当前用户：${data.user?.username || ""}`;
      return data.user;
    }

    loadMe().catch(() => {
      location.href = `/login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
    });

    document.getElementById("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      msg.textContent = "";
      const oldPassword = document.getElementById("oldPassword").value;
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      if (newPassword !== confirmPassword) {
        msg.textContent = "两次输入的新密码不一致";
        return;
      }
      submit.disabled = true;
      try {
        const response = await fetch("/api/auth/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ old_password: oldPassword, new_password: newPassword, confirm_password: confirmPassword })
        });
        const data = await response.json();
        if (response.ok) {
          await fetch("/api/auth/logout", { method: "POST" });
          location.href = `/login.html?next=${encodeURIComponent(next)}`;
        } else {
          msg.textContent = data.message || "修改失败";
        }
      } catch (error) {
        msg.textContent = error.message;
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
