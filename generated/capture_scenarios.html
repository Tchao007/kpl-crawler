<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开盘啦抓包场景调用清单</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667380;
      --line: #d8dee6;
      --accent: #136f63;
      --accent-soft: #e6f4f1;
      --blue: #205b9f;
      --blue-soft: #eaf1fb;
      --amber: #9f5b13;
      --amber-soft: #fff0df;
      --danger: #b0302a;
      --shadow: 0 10px 24px rgba(25, 34, 45, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }
    .shell { min-height: 100vh; }
    .topbar {
      background: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .wrap {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
    }
    .topbar .wrap {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }
    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }
    .search, .select, .btn {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
    }
    .search, .select {
      padding: 0 12px;
      min-width: 180px;
      outline: none;
    }
    .search { width: 320px; }
    .btn {
      padding: 0 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { border-color: #b8c2cc; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:disabled { opacity: .65; cursor: not-allowed; }
    .btn.ghost { background: #fff; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 16px 0 4px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { margin-top: 4px; font-size: 22px; font-weight: 700; }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 16px 0 8px;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chip.blue.active { background: var(--blue); border-color: var(--blue); }
    .panel {
      margin: 10px 0 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .panel-head strong { font-size: 16px; }
    .hint { color: var(--muted); font-size: 12px; }
    .group {
      border-top: 1px solid var(--line);
    }
    .group:first-child { border-top: 0; }
    .group-title {
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: #fafbfc;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .group-title span { color: var(--muted); font-weight: 500; }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: #fff;
    }
    .card-head {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      word-break: break-word;
    }
    .meta {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .tag.blue { background: var(--blue-soft); color: var(--blue); border-color: #cfe0f6; }
    .tag.green { background: var(--accent-soft); color: var(--accent); border-color: #cfeae5; }
    .tag.orange { background: var(--amber-soft); color: var(--amber); border-color: #f5d5b2; }
    .tag.gray { background: #f2f4f7; color: #51606f; border-color: #e1e6ec; }
    .kv {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 6px 10px;
      font-size: 12px;
    }
    .kv div:nth-child(odd) { color: var(--muted); }
    .kv code, .endpoint {
      background: #f7f9fb;
      border: 1px solid #e4e9ef;
      border-radius: 6px;
      padding: 2px 6px;
      word-break: break-all;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tiny {
      height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    .tiny.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tiny:disabled { opacity: .6; cursor: not-allowed; }
    .empty {
      padding: 40px 16px;
      color: var(--muted);
      text-align: center;
    }
    .loading {
      padding: 14px 16px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    @media (max-width: 1120px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cards { grid-template-columns: 1fr; }
      .search { width: 100%; }
      .toolbar { width: 100%; justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="wrap">
        <div>
          <h1>开盘啦抓包场景调用清单</h1>
          <div class="sub">自动加载 88 个场景，按业务分组展示，单条手动调用，不做批量压测。</div>
        </div>
        <div class="toolbar">
          <input id="searchInput" class="search" type="search" placeholder="搜索标题、session、域名、接口路径">
          <select id="hostFilter" class="select">
            <option value="all">全部域名</option>
          </select>
          <button id="reloadBtn" class="btn ghost">重新加载</button>
          <button id="copyAllBtn" class="btn primary">复制当前列表</button>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="stats" id="stats"></div>
      <div class="filters" id="groupFilters"></div>

      <div class="panel">
        <div class="panel-head">
          <strong id="panelTitle">场景列表</strong>
          <div class="hint" id="panelHint">准备加载中</div>
        </div>
        <div id="loading" class="loading">正在从 /api/scenarios 拉取场景...</div>
        <div id="list"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = location.origin && location.origin !== "null" ? location.origin : "http://127.0.0.1:8765";
    const state = {
      scenarios: [],
      filtered: [],
      group: "全部",
      host: "all",
      query: "",
      loading: false,
      busyId: null
    };

    const el = {
      stats: document.getElementById("stats"),
      groupFilters: document.getElementById("groupFilters"),
      panelTitle: document.getElementById("panelTitle"),
      panelHint: document.getElementById("panelHint"),
      loading: document.getElementById("loading"),
      list: document.getElementById("list"),
      searchInput: document.getElementById("searchInput"),
      hostFilter: document.getElementById("hostFilter"),
      reloadBtn: document.getElementById("reloadBtn"),
      copyAllBtn: document.getElementById("copyAllBtn")
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function hostFromUrl(url) {
      try {
        return new URL(url).host || "";
      } catch (_) {
        return "";
      }
    }

    function normalizeScenario(item) {
      const host = item.host || hostFromUrl(item.target_url || item.url || "");
      return {
        sessionId: String(item.session_id ?? item.sessionId ?? ""),
        title: item.title || item.name || "未命名场景",
        methodName: item.method_name || item.methodName || "",
        httpMethod: item.http_method || item.httpMethod || "POST",
        targetUrl: item.target_url || item.url || "",
        endpoint: item.endpoint || "",
        aliasEndpoint: item.alias_endpoint || "",
        params: item.params || {},
        data: item.data || {},
        host,
        group: inferGroup(item, host)
      };
    }

    function inferGroup(item, host) {
      const title = String(item.title || "");
      const text = `${host} ${title}`.toLowerCase();
      if (text.includes("apphwhq")) return "行情核心";
      if (text.includes("apphis")) return "历史数据";
      if (text.includes("apparticle")) return "资讯内容";
      if (text.includes("appuser") || text.includes("applog")) return "用户与埋点";
      if (text.includes("getsockip")) return "网络配置";
      if (text.includes("applhb")) {
        if (text.includes("longhubang") || text.includes("龙虎榜")) return "龙虎榜";
        if (text.includes("stock") || text.includes("个股") || text.includes("盘口")) return "个股详情";
        return "龙虎榜";
      }
      return "其他";
    }

    function prettyKeyValueMap(obj) {
      const entries = Object.entries(obj || {});
      if (!entries.length) return "<div>无</div><div>-</div>";
      return entries.map(([key, value]) => `<div>${escapeHtml(key)}</div><div><code>${escapeHtml(value)}</code></div>`).join("");
    }

    function statCard(label, value) {
      return `<div class="stat"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div></div>`;
    }

    function groupList(items, key) {
      const map = new Map();
      items.forEach((item) => {
        const groupKey = item[key] || "其他";
        if (!map.has(groupKey)) map.set(groupKey, []);
        map.get(groupKey).push(item);
      });
      return map;
    }

    function renderStats(items) {
      const hosts = new Set(items.map((item) => item.host).filter(Boolean));
      const groups = new Set(items.map((item) => item.group));
      el.stats.innerHTML = [
        statCard("场景总数", items.length),
        statCard("域名数量", hosts.size),
        statCard("分组数量", groups.size),
        statCard("当前筛选", state.group === "全部" ? "全部" : state.group)
      ].join("");
    }

    function renderGroupFilters(items) {
      const groups = ["全部", ...new Set(items.map((item) => item.group))];
      el.groupFilters.innerHTML = groups.map((group) => {
        const active = group === state.group ? "active" : "";
        return `<button class="chip ${active}" data-group="${escapeHtml(group)}">${escapeHtml(group)}</button>`;
      }).join("");
    }

    function renderHostOptions(items) {
      const current = state.host;
      const hosts = ["all", ...new Set(items.map((item) => item.host).filter(Boolean))];
      el.hostFilter.innerHTML = hosts.map((host) => {
        const label = host === "all" ? "全部域名" : host;
        const selected = host === current ? " selected" : "";
        return `<option value="${escapeHtml(host)}"${selected}>${escapeHtml(label)}</option>`;
      }).join("");
    }

    function render(items) {
      state.filtered = items.filter((item) => {
        const matchGroup = state.group === "全部" || item.group === state.group;
        const matchHost = state.host === "all" || item.host === state.host;
        const haystack = [
          item.sessionId,
          item.title,
          item.methodName,
          item.endpoint,
          item.aliasEndpoint,
          item.host,
          JSON.stringify(item.params),
          JSON.stringify(item.data)
        ].join(" ").toLowerCase();
        const matchQuery = !state.query || haystack.includes(state.query.toLowerCase());
        return matchGroup && matchHost && matchQuery;
      });

      renderStats(items);
      renderGroupFilters(items);
      renderHostOptions(items);

      el.panelTitle.textContent = `场景列表 · ${state.filtered.length} / ${items.length}`;
      el.panelHint.textContent = state.loading ? "加载中" : "单条点击即可调用对应接口";

      const grouped = groupList(state.filtered, "group");
      const groupNames = Array.from(grouped.keys());
      if (!groupNames.length) {
        el.list.innerHTML = `<div class="empty">没有找到匹配的场景。</div>`;
        return;
      }

      el.list.innerHTML = groupNames.map((groupName) => {
        const groupItems = grouped.get(groupName) || [];
        return `
          <section class="group">
            <div class="group-title">
              <div>${escapeHtml(groupName)}</div>
              <span>${groupItems.length} 条</span>
            </div>
            <div class="cards">
              ${groupItems.map(renderCard).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    function renderCard(item) {
      const endpoint = item.endpoint || item.aliasEndpoint || "";
      const methodTag = item.httpMethod === "GET"
        ? '<span class="tag blue">GET</span>'
        : '<span class="tag green">POST</span>';
      const busy = state.busyId === item.sessionId ? "disabled" : "";
      return `
        <article class="card">
          <div class="card-head">
            <div>
              <h3 class="title">${escapeHtml(item.title)}</h3>
              <div class="meta">
                <span class="tag gray">session ${escapeHtml(item.sessionId)}</span>
                <span class="tag orange">${escapeHtml(item.host || "unknown host")}</span>
                ${methodTag}
              </div>
            </div>
          </div>
          <div class="kv">
            <div>接口</div><div class="endpoint">${escapeHtml(endpoint)}</div>
            <div>目标</div><div>${escapeHtml(item.targetUrl || "-")}</div>
            <div>别名</div><div class="endpoint">${escapeHtml(item.aliasEndpoint || "-")}</div>
          </div>
          <div class="kv" style="margin-top: 12px;">
            <div>参数</div><div>${prettyKeyValueMap(item.params)}</div>
            <div>表单</div><div>${prettyKeyValueMap(item.data)}</div>
          </div>
          <div class="actions">
            <button class="tiny" data-action="copy-endpoint" data-id="${escapeHtml(item.sessionId)}" data-value="${escapeHtml(endpoint)}">复制接口</button>
            <button class="tiny" data-action="copy-url" data-id="${escapeHtml(item.sessionId)}" data-value="${escapeHtml(item.targetUrl || "")}">复制目标</button>
            <button class="tiny primary" data-action="call" data-id="${escapeHtml(item.sessionId)}" ${busy}>调用场景</button>
          </div>
        </article>
      `;
    }

    async function copyText(text) {
      await navigator.clipboard.writeText(text);
    }

    function buildRequestUrl(item) {
      const url = new URL(item.endpoint || item.aliasEndpoint, API_BASE);
      const params = new URLSearchParams();
      if ((item.httpMethod || "POST").toUpperCase() === "GET") {
        Object.entries(item.params || {}).forEach(([k, v]) => params.set(k, v));
        Object.entries(item.data || {}).forEach(([k, v]) => params.set(k, v));
      } else {
        Object.entries(item.params || {}).forEach(([k, v]) => params.set(k, v));
      }
      const query = params.toString();
      if (query) url.search = query;
      return url.toString();
    }

    async function callScenario(item, button) {
      if (state.busyId) return;
      state.busyId = item.sessionId;
      button.disabled = true;
      button.textContent = "调用中";
      try {
        const requestUrl = buildRequestUrl(item);
        const init = {
          method: item.httpMethod || "POST",
          headers: { "Accept": "application/json" }
        };
        if ((item.httpMethod || "POST").toUpperCase() === "POST") {
          const body = new URLSearchParams();
          Object.entries(item.data || {}).forEach(([k, v]) => body.set(k, v));
          init.headers["Content-Type"] = "application/x-www-form-urlencoded; charset=UTF-8";
          init.body = body.toString();
        }
        const response = await fetch(requestUrl, init);
        const text = await response.text();
        alert(`调用完成: ${response.status}\n\n${text.slice(0, 900)}`);
      } catch (error) {
        alert(`调用失败: ${error.message}`);
      } finally {
        state.busyId = null;
        button.disabled = false;
        button.textContent = "调用场景";
      }
    }

    async function loadScenarios() {
      state.loading = true;
      el.loading.textContent = "正在从 /api/scenarios 拉取场景...";
      try {
        const response = await fetch(new URL("/api/scenarios", API_BASE), { cache: "no-store" });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        state.scenarios = (payload.scenarios || []).map(normalizeScenario);
        state.loading = false;
        el.loading.textContent = "";
        render(state.scenarios);
      } catch (error) {
        state.loading = false;
        el.loading.textContent = `加载失败：${error.message}`;
        el.list.innerHTML = `<div class="empty">无法获取场景列表，请确认后端服务已启动。</div>`;
        renderStats([]);
      }
    }

    document.addEventListener("click", async (event) => {
      const chip = event.target.closest("[data-group]");
      if (chip) {
        state.group = chip.getAttribute("data-group") || "全部";
        render(state.scenarios);
        return;
      }

      const action = event.target.closest("[data-action]");
      if (!action) return;
      const id = action.getAttribute("data-id");
      const item = state.scenarios.find((scenario) => scenario.sessionId === id);
      if (!item) return;
      const kind = action.getAttribute("data-action");
      if (kind === "copy-endpoint") {
        await copyText(action.getAttribute("data-value") || "");
        action.textContent = "已复制";
        setTimeout(() => action.textContent = "复制接口", 1000);
      } else if (kind === "copy-url") {
        await copyText(action.getAttribute("data-value") || "");
        action.textContent = "已复制";
        setTimeout(() => action.textContent = "复制目标", 1000);
      } else if (kind === "call") {
        await callScenario(item, action);
      }
    });

    el.searchInput.addEventListener("input", () => {
      state.query = el.searchInput.value.trim();
      render(state.scenarios);
    });

    el.hostFilter.addEventListener("change", () => {
      state.host = el.hostFilter.value;
      render(state.scenarios);
    });

    el.reloadBtn.addEventListener("click", loadScenarios);
    el.copyAllBtn.addEventListener("click", async () => {
      const text = state.filtered.map((item) => `${item.sessionId}\t${item.title}\t${item.endpoint}`).join("\n");
      await copyText(text);
      el.copyAllBtn.textContent = "已复制";
      setTimeout(() => el.copyAllBtn.textContent = "复制当前列表", 1000);
    });

    loadScenarios();
  </script>
</body>
</html>
