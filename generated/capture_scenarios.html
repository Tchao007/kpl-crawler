<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开盘啦抓包场景调用清单</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667380;
      --line: #d8dee6;
      --accent: #136f63;
      --accent-soft: #e6f4f1;
      --blue: #205b9f;
      --blue-soft: #eaf1fb;
      --amber: #9f5b13;
      --amber-soft: #fff0df;
      --danger: #b0302a;
      --shadow: 0 10px 24px rgba(25, 34, 45, 0.08);
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
    }
    .shell { min-height: 100vh; }
    .topbar {
      background: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
    }
    .wrap {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto;
    }
    .topbar .wrap {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 700;
    }
    .sub {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
    }
    .search, .select, .btn {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
    }
    .search, .select {
      padding: 0 12px;
      min-width: 180px;
      outline: none;
    }
    .search { width: 320px; }
    .btn {
      padding: 0 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .userbar {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      min-height: 38px;
      color: var(--muted);
      font-size: 13px;
    }
    .navlink {
      height: 38px;
      display: inline-flex;
      align-items: center;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      font-weight: 600;
    }
    .btn:hover { border-color: #b8c2cc; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:disabled { opacity: .65; cursor: not-allowed; }
    .btn.ghost { background: #fff; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      padding: 16px 0 4px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
    }
    .stat .label { color: var(--muted); font-size: 12px; }
    .stat .value { margin-top: 4px; font-size: 22px; font-weight: 700; }
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 16px 0 8px;
    }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .chip.blue.active { background: var(--blue); border-color: var(--blue); }
    .panel {
      margin: 10px 0 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-head {
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }
    .panel-head strong { font-size: 16px; }
    .hint { color: var(--muted); font-size: 12px; }
    .group {
      border-top: 1px solid var(--line);
    }
    .group:first-child { border-top: 0; }
    .group-title {
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      background: #fafbfc;
      border-bottom: 1px solid var(--line);
      font-weight: 700;
    }
    .group-title span { color: var(--muted); font-weight: 500; }
    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 14px;
    }
    .card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      background: #fff;
    }
    .card-head {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      justify-content: space-between;
    }
    .title {
      display: flex;
      gap: 8px;
      align-items: baseline;
      flex-wrap: wrap;
      font-size: 15px;
      font-weight: 700;
      margin: 0;
      word-break: break-word;
    }
    .title-cn {
      color: var(--muted);
      font-weight: 600;
    }
    .maintenance-time {
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      background: #edf7f5;
      border: 1px solid #cfeae5;
      border-radius: 999px;
      padding: 2px 8px;
      white-space: nowrap;
    }
    .meta {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .tag.blue { background: var(--blue-soft); color: var(--blue); border-color: #cfe0f6; }
    .tag.green { background: var(--accent-soft); color: var(--accent); border-color: #cfeae5; }
    .tag.orange { background: var(--amber-soft); color: var(--amber); border-color: #f5d5b2; }
    .tag.gray { background: #f2f4f7; color: #51606f; border-color: #e1e6ec; }
    .tag.level-normal { background: #f2f4f7; color: #51606f; border-color: #e1e6ec; }
    .tag.level-important { background: #fff0df; color: #9f5b13; border-color: #f5d5b2; }
    .tag.level-rare { background: #fdecec; color: #b0302a; border-color: #f2b8b5; }
    .tag.level-pending_delete { background: #f4e8ff; color: #7c3aad; border-color: #dfc5f7; }
    .kv {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 108px minmax(0, 1fr);
      gap: 6px 10px;
      font-size: 12px;
    }
    .kv div:nth-child(odd) { color: var(--muted); }
    .kv code, .endpoint {
      background: #f7f9fb;
      border: 1px solid #e4e9ef;
      border-radius: 6px;
      padding: 2px 6px;
      word-break: break-all;
    }
    .call-url {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 8px;
      align-items: start;
      font-size: 12px;
    }
    .call-url span {
      color: var(--muted);
    }
    .call-url code {
      background: #f7f9fb;
      border: 1px solid #e4e9ef;
      border-radius: 6px;
      padding: 4px 6px;
      word-break: break-all;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .name-editor {
      margin-top: 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 148px 128px auto;
      gap: 8px;
      align-items: end;
      padding-top: 12px;
      border-top: 1px dashed var(--line);
    }
    .name-editor label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
    }
    .name-editor input {
      width: 100%;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
      background: #fff;
      color: var(--text);
      outline: none;
      min-width: 0;
    }
    .name-editor select {
      width: 100%;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
      font-size: 12px;
      background: #fff;
      color: var(--text);
      outline: none;
    }
    .name-editor input:focus,
    .name-editor select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(44, 123, 229, .12);
    }
    .tiny {
      height: 30px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #fff;
      cursor: pointer;
      font-size: 12px;
    }
    .tiny.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tiny:disabled { opacity: .6; cursor: not-allowed; }
    .empty {
      padding: 40px 16px;
      color: var(--muted);
      text-align: center;
    }
    .loading {
      padding: 14px 16px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 20;
      display: none;
      max-width: min(360px, calc(100vw - 40px));
      padding: 10px 12px;
      border-radius: 8px;
      background: #18202a;
      color: #fff;
      box-shadow: 0 16px 36px rgba(17, 24, 39, .18);
      font-size: 13px;
    }
    .toast.show { display: block; }
    .toast.error { background: #b0302a; }
    @media (max-width: 1120px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .cards { grid-template-columns: 1fr; }
      .search { width: 100%; }
      .toolbar { width: 100%; justify-content: flex-start; }
      .name-editor { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div class="shell">
    <div class="topbar">
      <div class="wrap">
        <div>
          <h1>开盘啦抓包场景调用清单</h1>
          <div class="sub">自动加载 88 个场景，按业务分组展示，单条手动调用，不做批量压测。</div>
        </div>
        <div class="toolbar">
          <input id="searchInput" class="search" type="search" placeholder="搜索标题、session、域名">
          <select id="hostFilter" class="select">
            <option value="all">全部域名</option>
          </select>
          <span id="currentUser" class="userbar">未登录</span>
          <a id="adminLink" class="navlink" href="/admin.html" style="display:none;">用户管理</a>
          <a id="callLogsLink" class="navlink" href="/admin.html#call-logs" style="display:none;">&#35843;&#29992;&#35760;&#24405;</a>
          <a class="navlink" href="/change_password.html">修改密码</a>
          <button id="reloadBtn" class="btn ghost">重新加载</button>
          <button id="copyAllBtn" class="btn primary">复制当前列表</button>
          <button id="logoutBtn" class="btn ghost">退出</button>
        </div>
      </div>
    </div>

    <div class="wrap">
      <div class="stats" id="stats"></div>
      <div class="filters" id="groupFilters"></div>

      <div class="panel">
        <div class="panel-head">
          <strong id="panelTitle">场景列表</strong>
          <div class="hint" id="panelHint">准备加载中</div>
        </div>
        <div id="loading" class="loading">正在从 /api/scenarios 拉取场景...</div>
        <div id="list"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = location.origin && location.origin !== "null" ? location.origin : "http://127.0.0.1:8765";
    const state = {
      scenarios: [],
      filtered: [],
      group: "全部",
      host: "all",
      levelOptions: [],
      query: "",
      loading: false,
      busyId: null,
      nameBusyId: null,
      user: null
    };

    const el = {
      stats: document.getElementById("stats"),
      groupFilters: document.getElementById("groupFilters"),
      panelTitle: document.getElementById("panelTitle"),
      panelHint: document.getElementById("panelHint"),
      loading: document.getElementById("loading"),
      list: document.getElementById("list"),
      searchInput: document.getElementById("searchInput"),
      hostFilter: document.getElementById("hostFilter"),
      currentUser: document.getElementById("currentUser"),
      adminLink: document.getElementById("adminLink"),
      callLogsLink: document.getElementById("callLogsLink"),
      reloadBtn: document.getElementById("reloadBtn"),
      copyAllBtn: document.getElementById("copyAllBtn"),
      logoutBtn: document.getElementById("logoutBtn"),
      toast: document.getElementById("toast")
    };

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function hostFromUrl(url) {
      try {
        return new URL(url).host || "";
      } catch (_) {
        return "";
      }
    }

    function normalizeScenario(item) {
      const host = item.host || hostFromUrl(item.target_url || item.url || "");
      return {
        sessionId: String(item.session_id ?? item.sessionId ?? ""),
        title: item.title || item.name || "未命名场景",
        titleCn: item.title_cn || item.titleCn || "",
        addedTime: item.added_time || item.addedTime || "",
        maintenanceTime: item.maintenance_time || item.maintenanceTime || "",
        methodName: item.method_name || item.methodName || "",
        httpMethod: item.http_method || item.httpMethod || "POST",
        targetUrl: item.target_url || item.url || "",
        endpoint: item.endpoint || "",
        aliasEndpoint: item.alias_endpoint || "",
        level: item.level || "normal",
        levelLabel: item.level_label || item.levelLabel || "一般",
        params: item.params || {},
        data: item.data || {},
        hideUrlFields: item.hide_url_fields || item.hideUrlFields || [],
        isCore: Boolean(item.is_core || item.isCore),
        host,
        group: inferGroup(item, host)
      };
    }

    function inferGroup(item, host) {
      if (item.level === "pending_delete") return "待删除模块";
      if (item.group) return String(item.group);
      const title = String(item.title || "");
      const titleCn = String(item.title_cn || item.titleCn || "");
      const sessionId = String(item.session_id || item.sessionId || "");
      const text = `${host} ${title} ${titleCn}`.toLowerCase();
      if (text.includes("stockfengkdata") || text.includes("forumstuyere") || text.includes("fengk") || text.includes("tuyere") || text.includes("市场风口") || text.includes("风口") || /^(429|430|432|18003|18013|18019|18021|18071)$/.test(sessionId)) return "市场风口模块";
      if (text.includes("local_hqstock") || text.includes("hqstock")) return "行情核心";
      if (text.includes("市场量能") || /^1822[5-9]$|^1823[0-2]$/.test(sessionId)) return "市场量能";
      if (text.includes("情绪") || text.includes("大幅回撤") || text.includes("涨停表现") || text.includes("风向标") || /^1820[8-9]$|^1821[0-9]$|^1822[0-4]$|^1823[3-9]$|^1824[0-8]$/.test(sessionId)) return "情绪模块";
      if (text.includes("apphwhq")) return "行情核心";
      if (text.includes("apphis")) return "历史数据";
      if (text.includes("apparticle")) return "资讯内容";
      if (text.includes("appuser") || text.includes("applog")) return "用户与埋点";
      if (text.includes("getsockip")) return "网络配置";
      if (text.includes("applhb")) {
        if (text.includes("longhubang") || text.includes("龙虎榜")) return "龙虎榜";
        if (text.includes("stock") || text.includes("个股") || text.includes("盘口")) return "个股详情";
        return "龙虎榜";
      }
      return "其他";
    }

    function prettyKeyValueMap(obj) {
      const entries = Object.entries(obj || {});
      if (!entries.length) return "<div>无</div><div>-</div>";
      return entries.map(([key, value]) => `<div>${escapeHtml(key)}</div><div><code>${escapeHtml(value)}</code></div>`).join("");
    }

    function statCard(label, value) {
      return `<div class="stat"><div class="label">${escapeHtml(label)}</div><div class="value">${escapeHtml(value)}</div></div>`;
    }

    function handleAuthFailure(response) {
      if (response.status === 401) {
        location.href = `/login.html?next=${encodeURIComponent(location.pathname + location.search)}`;
        return true;
      }
      if (response.status === 403) {
        response.clone().json().then((data) => {
          location.href = data.error === "expired" ? "/expired.html" : "/login.html";
        }).catch(() => location.href = "/login.html");
        return true;
      }
      return false;
    }

    function showToast(message, type = "success") {
      if (!el.toast) {
        alert(message);
        return;
      }
      el.toast.textContent = message;
      el.toast.className = `toast show${type === "error" ? " error" : ""}`;
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => {
        el.toast.className = "toast";
      }, 1800);
    }

    function renderUser() {
      if (!state.user) {
        el.currentUser.textContent = "未登录";
        el.adminLink.style.display = "none";
        el.callLogsLink.style.display = "none";
        return;
      }
      const expires = state.user.expires_at ? ` · 有效期 ${state.user.expires_at}` : "";
      el.currentUser.textContent = `${state.user.username} · ${state.user.role}${expires}`;
      el.adminLink.style.display = state.user.role === "admin" ? "inline-flex" : "none";
      el.callLogsLink.style.display = state.user.role === "admin" ? "inline-flex" : "none";
    }

    function groupList(items, key) {
      const map = new Map();
      items.forEach((item) => {
        const groupKey = item[key] || "其他";
        if (!map.has(groupKey)) map.set(groupKey, []);
        map.get(groupKey).push(item);
      });
      return map;
    }

    const LEVEL_SORT_ORDER = {
      rare: 0,
      important: 1,
      normal: 2,
      pending_delete: 3
    };

    function scenarioSortText(item) {
      return String(item.titleCn || item.title || item.sessionId || item.endpoint || "");
    }

    function scenarioDateSortValue(value) {
      const digits = String(value || "").replace(/\D/g, "").slice(0, 8);
      return digits.length === 8 ? Number(digits) : 0;
    }

    function sortScenarioItems(items) {
      return [...items].sort((a, b) => {
        const levelResult = (LEVEL_SORT_ORDER[a.level] ?? LEVEL_SORT_ORDER.normal) - (LEVEL_SORT_ORDER[b.level] ?? LEVEL_SORT_ORDER.normal);
        if (levelResult) return levelResult;
        const dateResult = scenarioDateSortValue(b.addedTime) - scenarioDateSortValue(a.addedTime);
        if (dateResult) return dateResult;
        const nameResult = scenarioSortText(a).localeCompare(scenarioSortText(b), "zh-Hans-CN", { numeric: true });
        if (nameResult) return nameResult;
        return String(a.sessionId).localeCompare(String(b.sessionId), "zh-Hans-CN", { numeric: true });
      });
    }

    function renderStats(items) {
      const hosts = new Set(items.map((item) => item.host).filter(Boolean));
      const groups = new Set(items.map((item) => item.group));
      el.stats.innerHTML = [
        statCard("场景总数", items.length),
        statCard("域名数量", hosts.size),
        statCard("分组数量", groups.size),
        statCard("当前筛选", state.group === "全部" ? "全部" : state.group)
      ].join("");
    }

    function renderGroupFilters(items) {
      const groups = ["全部", ...new Set(items.map((item) => item.group))];
      el.groupFilters.innerHTML = groups.map((group) => {
        const active = group === state.group ? "active" : "";
        return `<button class="chip ${active}" data-group="${escapeHtml(group)}">${escapeHtml(group)}</button>`;
      }).join("");
    }

    function renderHostOptions(items) {
      const current = state.host;
      const hosts = ["all", ...new Set(items.map((item) => item.host).filter(Boolean))];
      el.hostFilter.innerHTML = hosts.map((host) => {
        const label = host === "all" ? "全部域名" : host;
        const selected = host === current ? " selected" : "";
        return `<option value="${escapeHtml(host)}"${selected}>${escapeHtml(label)}</option>`;
      }).join("");
    }

    function render(items) {
      const sortedItems = sortScenarioItems(items);
      state.filtered = sortScenarioItems(sortedItems.filter((item) => {
        const matchGroup = state.group === "全部" || item.group === state.group;
        const matchHost = state.host === "all" || item.host === state.host;
        const haystack = [
          item.sessionId,
          item.title,
          item.titleCn,
          item.maintenanceTime,
          item.levelLabel,
          item.methodName,
          item.endpoint,
          item.aliasEndpoint,
          item.host,
          JSON.stringify(item.params),
          JSON.stringify(item.data)
        ].join(" ").toLowerCase();
        const matchQuery = !state.query || haystack.includes(state.query.toLowerCase());
        return matchGroup && matchHost && matchQuery;
      }));

      renderStats(sortedItems);
      renderGroupFilters(sortedItems);
      renderHostOptions(sortedItems);

      el.panelTitle.textContent = `场景列表 · ${state.filtered.length} / ${sortedItems.length}`;
      el.panelHint.textContent = state.loading ? "加载中" : "单条点击即可调用对应场景";

      const grouped = groupList(state.filtered, "group");
      const groupNames = Array.from(grouped.keys());
      if (!groupNames.length) {
        el.list.innerHTML = `<div class="empty">没有找到匹配的场景。</div>`;
        return;
      }

      el.list.innerHTML = groupNames.map((groupName) => {
        const groupItems = grouped.get(groupName) || [];
        return `
          <section class="group">
            <div class="group-title">
              <div>${escapeHtml(groupName)}</div>
              <span>${groupItems.length} 条</span>
            </div>
            <div class="cards">
              ${groupItems.map(renderCard).join("")}
            </div>
          </section>
        `;
      }).join("");
    }

    function renderCard(item) {
      const methodTag = item.httpMethod === "GET"
        ? '<span class="tag blue">GET</span>'
        : '<span class="tag green">POST</span>';
      const busy = state.busyId === item.sessionId ? "disabled" : "";
      const canEditName = state.user && state.user.role === "admin";
      const savingName = state.nameBusyId === item.sessionId;
      const requestUrl = buildRequestUrl(item);
      const levelOptions = (state.levelOptions.length ? state.levelOptions : [
        { value: "normal", label: "一般" },
        { value: "important", label: "重要" },
        { value: "rare", label: "稀缺" },
        { value: "pending_delete", label: "待删除" }
      ]).map((option) => (
        `<option value="${escapeHtml(option.value)}" ${option.value === item.level ? "selected" : ""}>${escapeHtml(option.label)}</option>`
      )).join("");
      const nameEditor = canEditName ? `
          <div class="name-editor">
            <label>
              <span>英文名</span>
              <input type="text" data-name-field="title" value="${escapeHtml(item.title)}" autocomplete="off">
            </label>
            <label>
              <span>中文名</span>
              <input type="text" data-name-field="title_cn" value="${escapeHtml(item.titleCn)}" autocomplete="off">
            </label>
            <label>
              <span>维护时间</span>
              <input type="text" data-name-field="maintenance_time" value="${escapeHtml(item.maintenanceTime)}" placeholder="例如 2026-06-25" autocomplete="off">
            </label>
            <label>
              <span>分级</span>
              <select data-name-field="level">${levelOptions}</select>
            </label>
            <button class="tiny" data-action="save-name" data-id="${escapeHtml(item.sessionId)}" ${savingName ? "disabled" : ""}>${savingName ? "保存中" : "保存管理"}</button>
          </div>
        ` : "";
      return `
        <article class="card">
          <div class="card-head">
            <div>
              <h3 class="title">
                <span>${escapeHtml(item.title)}</span>
                ${item.titleCn ? `<span class="title-cn">${escapeHtml(item.titleCn)}</span>` : ""}
                ${canEditName && item.maintenanceTime ? `<span class="maintenance-time">${escapeHtml(item.maintenanceTime)}</span>` : ""}
              </h3>
              <div class="meta">
                <span class="tag gray">session ${escapeHtml(item.sessionId)}</span>
                <span class="tag level-${escapeHtml(item.level)}">${escapeHtml(item.levelLabel)}</span>
                <span class="tag orange">${escapeHtml(item.host || "unknown host")}</span>
                ${methodTag}
              </div>
            </div>
          </div>
          <div class="call-url">
            <span>调用 URL</span>
            <code>${escapeHtml(requestUrl)}</code>
          </div>
          ${nameEditor}
          <div class="actions">
            <button class="tiny primary" data-action="call" data-id="${escapeHtml(item.sessionId)}" ${busy}>调用场景</button>
          </div>
        </article>
      `;
    }

    async function copyText(text) {
      await navigator.clipboard.writeText(text);
    }

    function buildRequestUrl(item) {
      const url = new URL(item.endpoint || item.aliasEndpoint, API_BASE);
      const params = new URLSearchParams();
      if ((item.httpMethod || "POST").toUpperCase() === "GET") {
        Object.entries(item.params || {}).forEach(([k, v]) => params.set(k, v));
        Object.entries(item.data || {}).forEach(([k, v]) => params.set(k, v));
      } else {
        Object.entries(item.params || {}).forEach(([k, v]) => params.set(k, v));
        getUrlManagedFields(item).forEach((key) => params.set(key, item.data[key]));
      }
      const query = params.toString();
      if (query) url.search = query;
      return url.toString();
    }

    function getUrlManagedFields(item) {
      if (!item.data) return [];
      const hiddenFields = new Set(item.hideUrlFields || item.hide_url_fields || []);
      const configuredFields = (item.urlParams || item.url_params || []).filter((key) => item.data[key] && !hiddenFields.has(key));
      const fields = ["Day", "Date", "DStart", "DEnd", "SDay", "EDay", "GID", "Type", "ZSType"].filter((key) => item.data[key] && !hiddenFields.has(key));
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(item.data.Time || ""))) fields.push("Time");
      return [...new Set([...configuredFields, ...fields])];
    }

    async function callScenario(item, button) {
      if (state.busyId) return;
      state.busyId = item.sessionId;
      button.disabled = true;
      button.textContent = "调用中";
      try {
        const requestUrl = buildRequestUrl(item);
        const init = {
          method: item.httpMethod || "POST",
          headers: { "Accept": "application/json" }
        };
        if ((item.httpMethod || "POST").toUpperCase() === "POST") {
          const body = new URLSearchParams();
          const urlManagedFields = new Set(getUrlManagedFields(item));
          Object.entries(item.data || {}).forEach(([k, v]) => {
            if (urlManagedFields.has(k)) return;
            body.set(k, v);
          });
          init.headers["Content-Type"] = "application/x-www-form-urlencoded; charset=UTF-8";
          init.body = body.toString();
        }
        const response = await fetch(requestUrl, init);
        if (handleAuthFailure(response)) return;
        const text = await response.text();
        alert(`调用完成: ${response.status}\n\n${text.slice(0, 900)}`);
      } catch (error) {
        alert(`调用失败: ${error.message}`);
      } finally {
        state.busyId = null;
        button.disabled = false;
        button.textContent = "调用场景";
      }
    }

    async function saveScenarioName(item, button) {
      if (!state.user || state.user.role !== "admin") {
        showToast("只有管理员可以修改名称", "error");
        return;
      }
      const editor = button.closest(".name-editor");
      const titleInput = editor && editor.querySelector('[data-name-field="title"]');
      const titleCnInput = editor && editor.querySelector('[data-name-field="title_cn"]');
      const maintenanceTimeInput = editor && editor.querySelector('[data-name-field="maintenance_time"]');
      const levelSelect = editor && editor.querySelector('[data-name-field="level"]');
      const title = titleInput ? titleInput.value.trim() : "";
      const titleCn = titleCnInput ? titleCnInput.value.trim() : "";
      const maintenanceTime = maintenanceTimeInput ? maintenanceTimeInput.value.trim() : "";
      const level = levelSelect ? levelSelect.value : (item.level || "normal");
      if (!title || !titleCn) {
        showToast("中英文名称不能为空", "error");
        return;
      }
      state.nameBusyId = item.sessionId;
      button.disabled = true;
      button.textContent = "保存中";
      try {
        const response = await fetch(new URL(`/api/admin/scenario-meta/${encodeURIComponent(item.sessionId)}`, API_BASE), {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            title,
            title_cn: titleCn,
            maintenance_time: maintenanceTime,
            level
          })
        });
        if (handleAuthFailure(response)) return;
        const payload = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(payload.message || payload.error || `HTTP ${response.status}`);
        const updated = normalizeScenario(payload.scenario || {});
        const index = state.scenarios.findIndex((scenario) => scenario.sessionId === item.sessionId);
        if (index >= 0) {
          state.scenarios[index] = {
            ...state.scenarios[index],
            title: updated.title,
            titleCn: updated.titleCn,
            addedTime: updated.addedTime,
            maintenanceTime: updated.maintenanceTime,
            level: updated.level,
            levelLabel: updated.levelLabel,
            endpoint: updated.endpoint || state.scenarios[index].endpoint,
            aliasEndpoint: updated.aliasEndpoint || state.scenarios[index].aliasEndpoint
          };
        }
        state.nameBusyId = null;
        showToast("接口管理信息修改成功");
        render(state.scenarios);
      } catch (error) {
        showToast(`接口管理信息修改失败：${error.message}`, "error");
      } finally {
        if (state.nameBusyId === item.sessionId) {
          state.nameBusyId = null;
        }
        if (button.isConnected) {
          button.disabled = false;
          button.textContent = "保存管理";
        }
      }
    }

    async function loadScenarios() {
      state.loading = true;
      el.loading.textContent = "正在从 /api/scenarios 拉取场景...";
      try {
        const response = await fetch(new URL("/api/scenarios", API_BASE), { cache: "no-store" });
        if (handleAuthFailure(response)) return;
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const payload = await response.json();
        state.user = payload.user || state.user;
        state.levelOptions = payload.level_options || state.levelOptions;
        renderUser();
        state.scenarios = (payload.scenarios || []).map(normalizeScenario);
        state.loading = false;
        el.loading.textContent = "";
        render(state.scenarios);
      } catch (error) {
        state.loading = false;
        el.loading.textContent = `加载失败：${error.message}`;
        el.list.innerHTML = `<div class="empty">无法获取场景列表，请确认后端服务已启动。</div>`;
        renderStats([]);
      }
    }

    document.addEventListener("click", async (event) => {
      const chip = event.target.closest("[data-group]");
      if (chip) {
        state.group = chip.getAttribute("data-group") || "全部";
        render(state.scenarios);
        return;
      }

      const action = event.target.closest("[data-action]");
      if (!action) return;
      const id = action.getAttribute("data-id");
      const item = state.scenarios.find((scenario) => scenario.sessionId === id);
      if (!item) return;
      const kind = action.getAttribute("data-action");
      if (kind === "call") {
        await callScenario(item, action);
      } else if (kind === "save-name") {
        await saveScenarioName(item, action);
      }
    });

    el.searchInput.addEventListener("input", () => {
      state.query = el.searchInput.value.trim();
      render(state.scenarios);
    });

    el.hostFilter.addEventListener("change", () => {
      state.host = el.hostFilter.value;
      render(state.scenarios);
    });

    el.reloadBtn.addEventListener("click", loadScenarios);
    el.logoutBtn.addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST" });
      location.href = "/login.html";
    });
    el.copyAllBtn.addEventListener("click", async () => {
      const text = state.filtered.map((item) => `${item.sessionId}\t${item.title}\t${item.titleCn || ""}\t${item.endpoint}`).join("\n");
      await copyText(text);
      el.copyAllBtn.textContent = "已复制";
      setTimeout(() => el.copyAllBtn.textContent = "复制当前列表", 1000);
    });

    loadScenarios();
  </script>
</body>
</html>
